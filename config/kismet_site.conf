# Kismet overrides for the wardriver. Installed to /etc/kismet/kismet_site.conf.
# Anything here wins over the stock /etc/kismet/*.conf files.

server_name=wardriver

# --- Sources -----------------------------------------------------------------
# alfa0 is the ALFA USB adapter, pinned to that name by system/10-wardrive-alfa.link
# so it can never swap places with the onboard wlan0 (our SSH link).
source=alfa0:name=alfa,type=linuxwifi
# Onboard Pi 4 Bluetooth radio (BT classic + BLE).
source=hci0:name=bluetooth,type=linuxbluetooth

# --- GPS ---------------------------------------------------------------------
gps=gpsd:host=localhost,port=2947,reconnect=true

# --- Logging -----------------------------------------------------------------
log_prefix=/var/lib/wardrive/logs
log_title=wardrive
log_types=kismet,wiglecsv

# --- REST API ----------------------------------------------------------------
# Only the local UI talks to Kismet; never expose it on the network.
httpd_bind_address=127.0.0.1

# --- Survey tuning (adapted from stock kismet_wardrive.conf) -----------------
# Track access points only, skip HT/VHT sub-channels so hopping covers the
# band faster, and drop data frames we don't need for wardriving.
dot11_datasource_opt=ht_channels,false
dot11_datasource_opt=vht_channels,false
dot11_datasource_opt=default_ht20,false
dot11_datasource_opt=expand_ht20,false
dot11_datasource_opt=filter_mgmt,true
dot11_ap_only_survey=true
dot11_fingerprint_devices=false
dot11_keep_ietags=false
dot11_keep_eapol=false
kis_log_data_packets=false
kis_log_channel_history=false
