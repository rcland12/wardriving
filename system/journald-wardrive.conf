# Keep logs across reboots so a drive can be debugged after the Pi is back home.
# Installed to /etc/systemd/journald.conf.d/90-wardrive.conf; the 90- prefix sorts
# after Raspberry Pi OS's 40-rpi-volatile-storage.conf, which would otherwise keep
# the journal in RAM only.
[Journal]
Storage=persistent
SystemMaxUse=50M
SystemKeepFree=1G
