# GPS time from gpsd shared memory. The Pi has no RTC, so in the car (no
# network) this is the only way log timestamps end up correct.
# Installed to /etc/chrony/conf.d/wardrive-gps.conf.
#
# NMEA-over-USB time is only good to ~100 ms, hence the loose precision and
# the offset/delay fudge. NTP servers still win when home Wi-Fi is available.
refclock SHM 0 refid GPS precision 1e-1 offset 0.2 delay 0.2

# Allow stepping the clock at any time, not just the first few updates:
# the GPS may take minutes to get a fix after boot.
makestep 1 -1
